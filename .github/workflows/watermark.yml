name: Apply Watermark and Generate Data

on:
  push:
    paths:
      - 'images/uploads/**'
      - '_exhibition/**'

jobs:
  process_gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Libraries
        run: pip install Pillow PyYAML

      - name: Run Watermark Script
        run: python watermark.py || true

      - name: Run Data Generator
        run: python generate_data.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "워터마크 적용 및 갤러리 데이터 자동 갱신"
          file_pattern: "images/uploads/* gallery_data.json"
